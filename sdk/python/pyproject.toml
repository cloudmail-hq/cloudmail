[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cloudmail"
version = "0.2.0"
description = "Python client for the cloudmail API: send, read, agent inboxes, webhooks, approvals and the rest of the REST API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Tapetide" }]
keywords = ["email", "cloudmail", "tapetide", "cloudflare", "agents", "webhooks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pytest==9.1.1",
    "respx==0.23.1",
]

[project.urls]
Homepage = "https://github.com/tapetide-com/tapetide-agentic-inbox"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudmail", "src/tapetide"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
